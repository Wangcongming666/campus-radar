# 通用配置；本机默认使用 application-dev.yml。
spring:
  application:
    name: campus-radar
  profiles:
    default: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never
  session:
    timeout: 30m
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: false
