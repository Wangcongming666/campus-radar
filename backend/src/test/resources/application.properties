# Unit/MockMvc tests must not connect to an ambient developer RabbitMQ.
# Real queue delivery is exercised separately by scripts/verify-live.sh.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
# Keep release-profile tests independent of the excluded local development YAML.
spring.mail.host=127.0.0.1
spring.mail.port=1
