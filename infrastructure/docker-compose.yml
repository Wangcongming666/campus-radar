# Local development only. All published ports bind loopback. No source is enabled.
name: campus-radar
services:
  postgres:
    build:
      context: ./postgres
    image: campus-radar-postgres:16.6-pgvector-0.8.7
    environment:
      POSTGRES_DB: campus_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localownerpassword}
      CAMPUS_WEB_PASSWORD: ${CAMPUS_WEB_PASSWORD:-localwebpassword}
      CAMPUS_WORKER_PASSWORD: ${CAMPUS_WORKER_PASSWORD:-localworkerpassword}
      CAMPUS_SCHEDULER_PASSWORD: ${CAMPUS_SCHEDULER_PASSWORD:-localschedulerpassword}
    ports: ["127.0.0.1:54322:5432"]
    volumes:
      - campus_pg:/var/lib/postgresql/data
      - ../database/migrations/0001_mvp.sql:/docker-entrypoint-initdb.d/01-mvp.sql:ro
      - ../database/migrations/0003_runtime_boundaries.sql:/docker-entrypoint-initdb.d/03-runtime.sql:ro
      - ../database/migrations/0004_stage_order_snapshots.sql:/docker-entrypoint-initdb.d/04-order-snapshots.sql:ro
      - ./init-local-roles.sh:/docker-entrypoint-initdb.d/05-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
  control:
    build:
      context: ..
      dockerfile: workers/Dockerfile
    environment: &worker-env
      WORKER_DATABASE_URL: postgresql://campus_worker_login:${CAMPUS_WORKER_PASSWORD:-localworkerpassword}@postgres:5432/campus_radar
      SCHEDULER_DATABASE_URL: postgresql://campus_scheduler_login:${CAMPUS_SCHEDULER_PASSWORD:-localschedulerpassword}@postgres:5432/campus_radar
      WORKER_CONTROL_TOKEN: ${WORKER_CONTROL_TOKEN:-localdevelopmentcontroltoken000000000000}
      CRAWL_ALLOWED_SOURCES: ""
      WEB_INTERNAL_ORIGIN: ${WEB_INTERNAL_ORIGIN:-}
      WORKER_HMAC_KEY_ID: ${WORKER_HMAC_KEY_ID:-}
      WORKER_HMAC_KEY: ${WORKER_HMAC_KEY:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m"]
  executor:
    build:
      context: ..
      dockerfile: workers/Dockerfile
    environment: *worker-env
    command: ["python", "-m", "campus_worker.executor.runner"]
    depends_on:
      postgres: {condition: service_healthy}
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m"]
  scheduler:
    build:
      context: ..
      dockerfile: workers/Dockerfile
    environment: *worker-env
    command: ["python", "-m", "campus_worker.scheduler.main"]
    depends_on:
      postgres: {condition: service_healthy}
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m"]
volumes:
  campus_pg:
